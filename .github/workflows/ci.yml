name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - run: node --check assets/js/search-replace.js

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    name: Integration (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported WordPress and PHP.
          - { php: '8.1', wp: '6.5.*', db: 'mysql:8.0' }
          - { php: '8.4', wp: '*', db: 'mysql:8.4' }
          - { php: '8.3', wp: '*', db: 'mariadb:10.11' }
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: relocate_tests
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: relocate_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Use WordPress ${{ matrix.wp }}
        run: composer require --dev --no-interaction --no-progress -W "roots/wordpress-no-content:${{ matrix.wp }}" "wp-phpunit/wp-phpunit:${{ matrix.wp }}"
      - run: composer test:integration
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:3306
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
          WP_TESTS_DB_NAME: relocate_tests
